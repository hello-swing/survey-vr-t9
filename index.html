<div id="hud">
  <h1>水準測量 VR 練習（試題九）</h1>
  <p>先選模式。第一次用請選「練習模式」，系統會一步一步帶你做，左邊的面板會告訴你下一步要做什麼。</p>

  拖曳滑鼠：看四周　滾輪：放大縮小<br>
  點面板上的按鈕：<b>點一下 = 轉一小格，按住 = 連續轉</b><br>
  <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd>（或方向鍵）在場地裡走動，加 <kbd>Shift</kbd> 跑步（實戰模式不能走動）。走遠了，畫面下方會出現「回到測站」按鈕<br>
  儀器用滑鼠點面板操作　數字鍵／+−×÷：輸入讀數或算式　Enter：確認</p>

<script type="module">
import * as THREE from 'three';

// ═════════════ 基本場景 ═════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd4e6);
scene.fog = new THREE.Fog(0xbcd4e6, 150, 450);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7a50, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(40, 80, 30); scene.add(sun);

const UI = 5;                 // 只給玩家眼睛看的圖層（望遠鏡看不到）
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 800);
camera.layers.enable(UI);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group(); scene.add(rig); rig.add(camera); camera.position.set(0, 1.6, 0);
const stationUI = new THREE.Group(); scene.add(stationUI);   // 測站旁的面板（固定在地上）
const instUI = new THREE.Group(); scene.add(instUI);         // 儀器台：釘在儀器上、轉向面對你（望遠鏡畫面、氣泡、操作面板）

const V3 = THREE.Vector3, UP = new V3(0, 1, 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const r3 = v => Math.round(v * 1000) / 1000;
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif';
const DEG = Math.PI / 180, MIN = DEG / 60;
function setLayer(o, l) { o.traverse(c => c.layers.set(l)); }
function at(o, x, y, z) { o.position.set(x, y, z); return o; }

let MODE = 'menu';            // 'menu' | 'practice' | 'exam'
const practiceOnly = [];      // 練習模式才顯示的 3D 物件

// ═════════════ 題目資料（隨機） ═════════════
const NAMES = 'ABCDEFG';
const SX = [0, 20, 40, 60, 80, 100, 120];
let D;
function interp(g, x) {
  if (x <= SX[0]) return g[0];
  if (x >= SX[6]) return g[6];
  const i = Math.min(5, Math.floor(x / 20)), t = (x - SX[i]) / 20;
  return g[i] + (g[i + 1] - g[i]) * t;
}
function genData() {
  for (;;) {
    const g = [0];
    for (let i = 1; i < 7; i++) g.push(g[i - 1] + rnd(-0.25, 0.25));
    const tops = g.map(v => v + 0.02);
    const st = [{ name: 'P', x: 30, z: 1.5, pts: [0, 1, 2, 3] }, { name: 'Q', x: 90, z: 1.5, pts: [3, 4, 5, 6] }];
    let ok = true;
    for (const s of st) {
      s.gy = interp(g, s.x); s.ih = rnd(1.38, 1.50);
      for (const i of s.pts) { const r = s.gy + s.ih - tops[i]; if (r < 0.35 || r > 2.6) ok = false; }
    }
    if (!ok) continue;
    const HA = r3(rnd(30, 150));
    const H = tops.map(t => HA + t - tops[0]);
    const G1s = [-1.2, -0.9, -0.7, -0.5, 0.5, 0.7, 0.9, 1.2], G1 = G1s[Math.floor(Math.random() * 8)];
    let G2 = [-1.2, -0.9, -0.6, -0.4, 0.4, 0.6, 0.9, 1.2][Math.floor(Math.random() * 8)]; if (G2 === G1) G2 = -G1;
    return { g, tops, st, HA, HG: r3(H[6]), H, HpA: r3(HA + rnd(-0.2, 0.2)), G1, G2, L: 120 };   // 後四個 = 豎曲線已知資料
  }
}
D = genData();
const groundAt = x => interp(D.g, x);
function trueRead(si, pi) {
  const s = D.st[si];
  const dist = Math.hypot(SX[pi] - s.x, 0 - s.z);
  const mid = s.gy + s.ih - D.tops[pi];
  return { mid, up: mid + dist / 200, low: mid - dist / 200, dist };
}

// ═════════════ 地面、道路、樹 ═════════════
const world = new THREE.Group(); scene.add(world);
let groundMesh, pathMesh;
function buildGround() {
  if (groundMesh) { world.remove(groundMesh, pathMesh); groundMesh.geometry.dispose(); pathMesh.geometry.dispose(); }
  const geo = new THREE.PlaneGeometry(700, 500, 350, 10); geo.rotateX(-Math.PI / 2); geo.translate(60, 0, 0);
  const p = geo.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    p.setY(i, groundAt(p.getX(i)) - 0.002);
    const k = 0.82 + Math.random() * 0.18; col.push(0.40 * k, 0.58 * k, 0.27 * k);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.computeVertexNormals();
  groundMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  const pg = new THREE.PlaneGeometry(140, 1.2, 70, 1); pg.rotateX(-Math.PI / 2); pg.translate(60, 0, 0);
  const pp = pg.attributes.position; for (let i = 0; i < pp.count; i++) pp.setY(i, groundAt(pp.getX(i)) + 0.004);
  pg.computeVertexNormals();
  pathMesh = new THREE.Mesh(pg, new THREE.MeshLambertMaterial({ color: 0xb9a57a }));
  world.add(groundMesh, pathMesh);
}
buildGround();
{
  const trunkM = new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), leafM = new THREE.MeshLambertMaterial({ color: 0x3d6b2f });
  for (let i = 0; i < 40; i++) {
    const x = rnd(-80, 200), z = (Math.random() < 0.5 ? -1 : 1) * rnd(12, 90), h = rnd(4, 9);
    world.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, h * 0.4, 6), trunkM), x, h * 0.2, z));
    world.add(at(new THREE.Mesh(new THREE.ConeGeometry(h * 0.28, h * 0.7, 8), leafM), x, h * 0.62, z));
  }
  const bM = new THREE.MeshLambertMaterial({ color: 0xd9d2c3 });
  for (const [x, z, w, h] of [[-40, -70, 18, 8], [150, -80, 24, 11], [60, 110, 30, 7]])
    world.add(at(new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), bM), x, h / 2, z));
}

// ═════════════ 文字標籤（3D 浮動） ═════════════
function labelTex(text, color = '#1f5fa8', bg = '#ffffff') {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 52;
  x.font = `500 ${fs}px ${FONT}`;
  c.width = Math.ceil(x.measureText(text).width) + 44; c.height = fs + 30;
  x.font = `500 ${fs}px ${FONT}`;
  x.fillStyle = bg; x.strokeStyle = color; x.lineWidth = 5;
  x.beginPath(); x.roundRect(3, 3, c.width - 6, c.height - 6, 16); x.fill(); x.stroke();
  x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(text, 22, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  return { t, aspect: c.width / c.height };
}
function makeSprite(text, h, color, bg) {
  const { t, aspect } = labelTex(text, color, bg);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(h * aspect, h, 1); s.renderOrder = 20; s.userData.aspect = aspect;
  return s;
}
// 部位標籤：只顯示「這一步用得到」的，避免互相重疊；大小隨距離自動調整
const labels = [];
let labelAll = false;
// anchor：零件上的點（parent 座標）；off：標籤要擺在「你看過去」的右/上多遠（公尺，0.65 m 距離時）
// 每幀依照你站的位置重新排，所以不管鏡頭轉到哪個方向，標籤都在固定的上下左右，不會互相疊在一起
function addLabel(key, parent, text, anchor, off, color = '#1f5fa8') {
  const g = new THREE.Group();
  const s = makeSprite(text, 0.03, color);
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([new V3(), new V3()]), new THREE.LineBasicMaterial({ color, depthTest: false }));
  ln.renderOrder = 19; ln.frustumCulled = false;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.004, 8, 6), new THREE.MeshBasicMaterial({ color, depthTest: false }));
  dot.renderOrder = 19;
  g.add(ln, s, dot); scene.add(g); setLayer(g, UI); g.visible = false;
  const L = { key, g, s, ln, dot, parent, anchor, off };
  labels.push(L);
  return L;
}

// ═════════════ 水準尺（5 mm 式，自繪） ═════════════
function staffCanvas(m) {
  // 仿考場用的 5 mm 刻劃尺（同老師網站「水準尺讀數5mm」教具樣式）：
  // 右側每公分一個小數字（149 = 1.49 m）；左欄每公分上半 5 mm 黑塊、右欄奇數公分整格黑，組成 E 字形；
  // 每公寸一條長橫線，紅色公寸數字在線下方、紅點（公尺數）在線上方；整公尺寫紅字＋M；每公尺底色白／黃交替
  const Hh = 4096, s = Hh / 1000, W = Math.round(50 * s), c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const x = c.getContext('2d'), Y = mm => Hh - (mm - m * 1000) * s, X = f => W * f;
  x.fillStyle = m % 2 === 0 ? '#f3f2ee' : '#fbe800'; x.fillRect(0, 0, W, Hh);
  x.fillStyle = '#777'; x.fillRect(0, 0, W * 0.045, Hh); x.fillRect(X(0.955), 0, W * 0.045, Hh);
  const ink = '#262626', red = '#e0001b';
  for (let n = m * 100 - 12; n < m * 100 + 112; n++) {
    if (n < 0) continue;
    const y0 = Y(n * 10), y5 = Y(n * 10 + 5), y1 = Y(n * 10 + 10);
    x.fillStyle = ink;
    x.fillRect(X(0.435), y1, W * 0.13, y5 - y1);
    if (n % 2 === 1) x.fillRect(X(0.565), y1, W * 0.065, y0 - y1);
    if (n % 5 === 0) x.fillRect(X(0.565), y0 - 2, W * 0.085, 4);
    if (n > 0) { x.font = `bold ${Math.round(6.2 * s)}px "Arial Narrow",Arial,sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(n), X(0.79), y0); }
    if (n % 10 === 0 && n > 0) {
      x.fillRect(X(0.17), y0 - 3, W * 0.265, 6);
      const meters = Math.floor(n / 100), dmD = (n / 10) % 10;
      x.fillStyle = red; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
      if (n % 100 === 0) {
        x.font = `bold ${Math.round(30 * s)}px Arial,sans-serif`; x.fillText(String(meters), X(0.3), Y(n * 10 + 4));
        x.font = `bold ${Math.round(25 * s)}px Arial,sans-serif`; x.fillText('M', X(0.3), Y(n * 10 - 29));
      } else {
        x.font = `bold ${Math.round(30 * s)}px Arial,sans-serif`; x.fillText(String(dmD), X(0.3), Y(n * 10 - 29));
        for (let i = 0; i < meters; i++) { x.beginPath(); x.arc(X(0.3) + (i - (meters - 1) / 2) * 3.5 * s * 2.8, Y(n * 10 + 9), 3.5 * s, 0, 7); x.fill(); }
      }
    }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  return t;
}const staffTex = [0, 1, 2].map(staffCanvas);
const staffBodyM = new THREE.MeshLambertMaterial({ color: 0xe8d9a0 });
const staffFaceM = staffTex.map(t => new THREE.MeshBasicMaterial({ map: t }));
const staffs = [], roleLabels = [];
const ROLE = ['A 起點（高度已知）', 'B 中間點', 'C 中間點', 'D 接力點', 'E 中間點', 'F 中間點', 'G 終點（高度已知）'];
const stakeM = new THREE.MeshLambertMaterial({ color: 0x9a7448 }), nailM = new THREE.MeshLambertMaterial({ color: 0x777777 });
function signTex(txt) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#1f5fa8'; x.lineWidth = 8; x.strokeRect(4, 4, 120, 120);
  x.fillStyle = '#1f5fa8'; x.font = 'bold 90px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const stakeGroup = new THREE.Group(); world.add(stakeGroup);
function buildStakes() {
  stakeGroup.clear(); staffs.length = 0; roleLabels.length = 0;
  for (let i = 0; i < 7; i++) {
    const top = D.tops[i], x0 = SX[i];
    stakeGroup.add(at(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.3, 0.03), stakeM), x0, top - 0.15, 0));
    stakeGroup.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.01, 8), nailM), x0, top + 0.004, 0));
    stakeGroup.add(at(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.7, 0.03), stakeM), x0 + 0.5, groundAt(x0) + 0.35, -0.6));
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.3), new THREE.MeshBasicMaterial({ map: signTex(NAMES[i]), side: THREE.DoubleSide }));
    stakeGroup.add(at(sign, x0 + 0.5, groundAt(x0) + 0.75, -0.6));
    const st = new THREE.Group(); st.position.set(x0, top, 0); st.userData.pt = i;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 3, 0.025), staffBodyM); body.position.y = 1.5; st.add(body);
    for (let m = 0; m < 3; m++) st.add(at(new THREE.Mesh(new THREE.PlaneGeometry(0.05, 1), staffFaceM[m]), 0, m + 0.5, 0.0131));
    stakeGroup.add(st); staffs.push(st);
    const rl = makeSprite(ROLE[i], 1, i === 0 || i === 6 ? '#a83a1f' : '#1f5fa8');
    rl.position.set(x0, top + 3.4, 0); rl.layers.set(UI); rl.userData.base = top;
    stakeGroup.add(rl); roleLabels.push(rl);
  }
}
buildStakes();

// ═════════════ 水準儀＋腳架 ═════════════
const inst = new THREE.Group(); scene.add(inst);
const tilted = new THREE.Group(); inst.add(tilted);
const upper = new THREE.Group(); tilted.add(upper);
const legs = new THREE.Group(); inst.add(legs);
const darkM = new THREE.MeshLambertMaterial({ color: 0x2c2f33 }), bodyM = new THREE.MeshLambertMaterial({ color: 0xe9ebe6 });
const legM = new THREE.MeshLambertMaterial({ color: 0xc9a46a });
function rod(a, b, r, m) {
  const d = new V3().subVectors(b, a), o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), m);
  o.position.copy(a).addScaledVector(d, 0.5); o.quaternion.setFromUnitVectors(UP, d.normalize()); return o;
}
const SCREW_R = 0.055, SCREW_A = [90, 210, 330].map(a => a * DEG);
const SCREW_COL = [0xd23b3b, 0x2f9e44, 0x1f5fa8], SCREW_CSS = ['#d23b3b', '#2f9e44', '#1f5fa8'], SCREW_NAME = ['紅', '綠', '藍'];
const screwMeshes = [];
let sightLine;
{
  tilted.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.012, 24), darkM), 0, 0.006, 0));
  tilted.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.012, 24), darkM), 0, 0.045, 0));
  SCREW_A.forEach((a, k) => {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.026, 16), new THREE.MeshLambertMaterial({ color: SCREW_COL[k] }));
    s.position.set(SCREW_R * Math.cos(a), 0.026, SCREW_R * Math.sin(a)); s.userData.screw = k; tilted.add(s); screwMeshes.push(s);
  });
  const vial = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.012, 24), new THREE.MeshLambertMaterial({ color: 0xcfe9f2 }));
  vial.position.set(0, 0.057, 0.035); tilted.add(vial);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.008, 0.0008, 6, 24), darkM); ring.rotation.x = Math.PI / 2; ring.position.set(0, 0.0635, 0.035); tilted.add(ring);
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(0.0055, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  bubble.scale.y = 0.4; bubble.position.set(0, 0.063, 0.035); tilted.add(bubble); tilted.userData.bubble = bubble;
  upper.position.y = 0.17;
  upper.add(new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.09, 0.2), bodyM));
  // 鏡頭（前面）：又大又像喇叭口，紅色環＋亮藍色鏡片
  const hoodM = new THREE.MeshLambertMaterial({ color: 0x2c2f33, side: THREE.DoubleSide });
  const hood = new THREE.Mesh(new THREE.CylinderGeometry(0.046, 0.035, 0.06, 28, 1, true), hoodM); hood.rotation.x = -Math.PI / 2; hood.position.z = -0.13; upper.add(hood);
  const redRing = new THREE.Mesh(new THREE.CylinderGeometry(0.037, 0.037, 0.014, 28), new THREE.MeshLambertMaterial({ color: 0xd23b3b })); redRing.rotation.x = Math.PI / 2; redRing.position.z = -0.106; upper.add(redRing);
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.036, 28), new THREE.MeshBasicMaterial({ color: 0x4fa3e0 })); lens.position.z = -0.135; lens.rotation.y = Math.PI; upper.add(lens);
  const glint = new THREE.Mesh(new THREE.CircleGeometry(0.009, 12), new THREE.MeshBasicMaterial({ color: 0xffffff })); glint.position.set(0.012, 0.012, -0.1352); glint.rotation.y = Math.PI; upper.add(glint);
  // 目鏡（後面）：細細小小、黑色橡膠眼罩，沒有亮色鏡片
  const eyeBase = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.024, 0.02, 20), darkM); eyeBase.rotation.x = Math.PI / 2; eyeBase.position.z = 0.108; upper.add(eyeBase);
  const eye = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.014, 0.03, 16), darkM); eye.rotation.x = Math.PI / 2; eye.position.z = 0.13; upper.add(eye);
  const cup = new THREE.Mesh(new THREE.TorusGeometry(0.014, 0.005, 8, 20), new THREE.MeshLambertMaterial({ color: 0x111111 })); cup.position.z = 0.146; upper.add(cup);
  // 練習模式：機身兩側印「前／後」，上面一個紅色箭頭指向前方
  const sideTex = (txt) => {
    const c = document.createElement('canvas'); c.width = 760; c.height = 200; const x = c.getContext('2d');

class Panel {
  constructor(w, h, pw, ph) {
    this.c = document.createElement('canvas'); this.c.width = pw; this.c.height = ph; this.x = this.c.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.c); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.anisotropy = MAXANI;
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: this.tex }));
    this.mesh.userData.panel = this; this.regions = [];
  }
  find(uv) {
    const px = uv.x * this.c.width, py = (1 - uv.y) * this.c.height;
    for (const r of this.regions) if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
    return null;
  }
  bg(col = '#fbfaf6') { this.regions = []; this.x.fillStyle = col; this.x.fillRect(0, 0, this.c.width, this.c.height); }
  rect(x0, y0, w, h, fill, stroke, lw = 2) { const x = this.x; x.beginPath(); x.roundRect(x0, y0, w, h, 12); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); } }
  text(t, x0, y0, size = 26, color = '#2b2a27', align = 'left', weight = '') {
    const x = this.x; x.font = `${weight} ${size}px ${FONT}`; x.fillStyle = color; x.textAlign = align; x.textBaseline = 'middle'; x.fillText(t, x0, y0);
  }
  wrap(t, x0, y0, maxW, size = 28, color = '#2b2a27', lh = 1.5, weight = '') {      // 中文逐字換行，回傳下一行 y
    const x = this.x; x.font = `${weight} ${size}px ${FONT}`; x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'middle';
    let line = '';
    for (const ch of t) {
      if (x.measureText(line + ch).width > maxW && line) { x.fillText(line, x0, y0); y0 += size * lh; line = ch; }
      else line += ch;
    }
    if (line) { x.fillText(line, x0, y0); y0 += size * lh; }
    return y0;
  }
  btn(x0, y0, w, h, label, fn, { fill = '#ffffff', color = '#2b2a27', size = 30, stroke = '#9a968c', rep = false, lw = 2 } = {}) {
    this.rect(x0, y0, w, h, fill, stroke, lw); this.text(label, x0 + w / 2, y0 + h / 2 + 1, size, color, 'center', '500');
    this.regions.push({ x: x0, y: y0, w, h, fn, rep });
  }
  update() { this.tex.needsUpdate = true; }
}

const TOPKEY = ['H_A', 'HB', 'HC', 'HD', 'HE', 'HF', 'HGc'];
const CALC1 = ['sumB', 'sumF', 'W', 'cbsA', 'cfsD', 'cbsD', 'cfsG', 'HI1', 'HB', 'HC', 'HD', 'HI2', 'HE', 'HF', 'HGc'];
const CALC2 = [...'BCDEFG'].map(p => 'Hd' + p).concat([...'ABCDEFG'].map(p => 'cut' + p));
const SIGNED = k => /^(cbs|cfs|W$|d[A-G]$)/.test(k);
function KEY_NAME(k) {

const fmtV = (k, v) => (SIGNED(k) && v >= 0 ? '+' : '') + v.toFixed(3);

const designH = x => D.HpA + D.G1 / 100 * x + (D.G2 - D.G1) / 100 * x * x / (2 * D.L);

function solve(v) {

  const f = (keys.ArrowUp || keys.KeyW ? 1 : 0) - (keys.ArrowDown || keys.KeyS ? 1 : 0), r = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0);
  if (f || r) {
    const sp = (keys.shift ? 7 : 2.5) * dt, a = look.yaw + rig.rotation.y;
    const nx = rig.position.x + (-Math.sin(a) * f + Math.cos(a) * r) * sp, nz = rig.position.z + (-Math.cos(a) * f - Math.sin(a) * r) * sp;
    if (inBounds(nx, nz)) { rig.position.x = nx; rig.position.z = nz; rig.position.y = groundAt(nx); }
  }
}

// ═════════════ 在場地裡移動、回到測站 ═════════════
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; keys.shift = e.shiftKey; if (e.code.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.code] = false; keys.shift = e.shiftKey; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const inBounds = (x, z) => x > -60 && x < 180 && Math.abs(z) < 60;
const hv = new V3(), hv2 = new V3(), hd = new V3();
function headWorld(v) { rig.updateMatrixWorld(true); return v.setFromMatrixPosition(camera.matrixWorld); }
function headYaw() { rig.updateMatrixWorld(true); camera.getWorldDirection(hd); return Math.atan2(-hd.x, -hd.z); }
function moveHeadTo(x, z) { headWorld(hv); rig.position.x += x - hv.x; rig.position.z += z - hv.z; rig.position.y = groundAt(x); }
function snapTurn(dir) {                       // 繞著頭轉，人不會被甩出去
  headWorld(hv); rig.rotation.y += dir * 30 * DEG; headWorld(hv2);
  rig.position.x += hv.x - hv2.x; rig.position.z += hv.z - hv2.z;      // 面板留在原地（要叫回來按 Y／B）
}
function teleportTo(x, z) { moveHeadTo(x, z); }
function homePos() { const s = D.st[S.si]; return { x: s.x, z: s.z + 0.6 }; }
// 走到側面看某個位置（練習模式內業用：從側面看，樁、視線、標籤才不會疊在一起）
function goView(x, z) {
  if (renderer.xr.isPresenting) { rig.rotation.y -= headYaw(); moveHeadTo(x, z); }
  else { rig.rotation.y = 0; rig.position.set(x, groundAt(x), z); look.yaw = 0; look.pitch = -0.08; }
  follow.force = follow.snap = true;
}
function viewFor(k) {
  if (/^(sumB|sumF|W|c(bs|fs))/.test(k) || k === 'intro') return { x: 60, z: 38, what: '整條路線' };
  if (k === 'HI1') return { x: 15, z: 9, what: 'A 和 P 站' };
  if (k === 'HI2') return { x: 75, z: 9, what: 'D 和 Q 站' };
  const p = /^H([B-F])$/.exec(k) || /^(?:Hd|d)([A-G])$/.exec(k) || (k === 'HGc' ? [0, 'G'] : null);
  if (p) { const i = NAMES.indexOf(p[1]); return { x: SX[i], z: 7, what: `${p[1]} 樁` }; }
  return null;
}
function returnHome() {
  const h = homePos();
  if (renderer.xr.isPresenting) {              // 轉回面向儀器，再把頭放回測站位置
    rig.rotation.y -= headYaw(); moveHeadTo(h.x, h.z);
  } else {
    rig.rotation.y = 0; rig.position.set(h.x, groundAt(h.x), h.z);
    look.yaw = 0; look.pitch = -0.3;
  }
  follow.force = follow.snap = true;
}
// 瞬移瞄準線（拋物線＋落點圓圈）
const tele = { ctrl: null, ok: false, p: new V3(), snapped: false };
const ARC_N = 48;
const arcLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(Array.from({ length: ARC_N }, () => new V3())), new THREE.LineBasicMaterial({ color: 0x4dabf7 }));
arcLine.frustumCulled = false;
const marker = new THREE.Mesh(new THREE.RingGeometry(0.22, 0.3, 32), new THREE.MeshBasicMaterial({ color: 0x4dabf7, side: THREE.DoubleSide }));
marker.rotation.x = -Math.PI / 2;
scene.add(arcLine, marker); arcLine.layers.set(UI); marker.layers.set(UI); arcLine.visible = marker.visible = false;
function updateTeleportArc() {
  const c = tele.ctrl; arcLine.visible = marker.visible = !!c; tele.ok = false;
  if (!c) return;
  const p0 = new V3().setFromMatrixPosition(c.matrixWorld);
  tmpM.identity().extractRotation(c.matrixWorld);
  const v = new V3(0, 0, -1).applyMatrix4(tmpM).multiplyScalar(10);
  const pos = arcLine.geometry.attributes.position, p = new V3();
  let hit = -1;
  for (let i = 0; i < ARC_N; i++) {
    const t = i * 0.04;
    if (hit < 0) { p.set(p0.x + v.x * t, p0.y + v.y * t - 4.9 * t * t, p0.z + v.z * t); if (p.y <= groundAt(p.x)) { p.y = groundAt(p.x); hit = i; } }
    pos.setXYZ(i, p.x, p.y, p.z);
  }
  pos.needsUpdate = true;
  tele.ok = hit > 0 && inBounds(p.x, p.z);
  arcLine.material.color.set(tele.ok ? 0x4dabf7 : 0xe03131);
  marker.visible = tele.ok; marker.position.set(p.x, p.y + 0.02, p.z); tele.p.copy(p);
}
// 懸浮「回到測站」按鈕：離開測站就出現在視線下方，跟著你走
const homeBtn = new Panel(0.34, 0.085, 680, 170);
setLayer(homeBtn.mesh, UI); scene.add(homeBtn.mesh); homeBtn.mesh.visible = false;
function drawHome() {
  const p = homeBtn; p.bg('#00000000'); p.x.clearRect(0, 0, 680, 170);
  p.btn(6, 6, 668, 158, `⌂ 回到 ${D.st[S.si].name} 站（儀器旁）`, returnHome, { fill: '#1f5fa8', color: '#fff', stroke: '#ffffff', size: 52, lw: 6 });
  p.update();
}
let homeShown = false;
function homeTick(dt) {
  const h = homePos(); headWorld(hv);
  const away = MODE !== 'menu' && Math.hypot(hv.x - h.x, hv.z - h.z) > 1.0;
  if (away !== homeShown) { homeShown = away; homeBtn.mesh.visible = away; if (away) { drawHome(); placeHomeBtn(1); } }
  if (away) placeHomeBtn(Math.min(1, dt * 3));
}
function placeHomeBtn(k) {
  const yaw = headYaw();
  hv2.set(hv.x - Math.sin(yaw) * 0.7, hv.y - 0.36, hv.z - Math.cos(yaw) * 0.7);
  homeBtn.mesh.position.lerp(hv2, k);
  homeBtn.mesh.lookAt(hv);
}
// 標籤：依步驟決定哪些顯示，並隨距離縮放
const STEP_LABELS = { level: ['bubble', 'screw'], aim: ['lens'], focus: ['focus'] };
function updateLabels() {
  const st = MODE === 'practice' ? steps[gi] : null;
  let want = [];
  if (st) want = labelAll ? null : st.kind === 'info' ? (gi === 0 ? null : ['lens', 'eye']) : (STEP_LABELS[st.kind] || []);
  camera.getWorldPosition(camPos);
  for (const L of labels) {
    L.g.visible = !!st && (want === null || want.includes(L.key));
    if (!L.g.visible) continue;
    const A = L.parent.localToWorld(lbA.copy(L.anchor));
    lbT.subVectors(camPos, A); lbT.y = 0; const d = Math.max(0.2, camPos.distanceTo(A)); lbT.normalize();
    lbR.crossVectors(UP, lbT);                                  // 你看過去的「右邊」
    const k = THREE.MathUtils.clamp(d / 0.65, 0.6, 5);          // 走遠了整組等比例放大，排版不變
    const P = lbP.copy(A).addScaledVector(lbR, L.off[0] * k).addScaledVector(UP, L.off[1] * k);
    const h = 0.022 * k;
    L.s.position.copy(P); L.s.scale.set(h * L.s.userData.aspect, h, 1);
    // 標籤往左時，讓文字整塊在線的左邊；往右時在右邊（線接在文字靠近零件的那一端）
    L.s.center.set(L.off[0] < -0.05 ? 1 : L.off[0] > 0.05 ? 0 : 0.5, L.off[1] >= 0 ? 0.3 : 0.7);
    const pa = L.ln.geometry.attributes.position; pa.setXYZ(0, A.x, A.y, A.z); pa.setXYZ(1, P.x, P.y, P.z); pa.needsUpdate = true;
    L.dot.position.copy(A); L.dot.scale.setScalar(k);
  }
}
const lbA = new V3(), lbT = new V3(), lbR = new V3(), lbP = new V3();

// ═════════════ 進入 VR ═════════════
const xrBtn = document.getElementById('xr');
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    xrBtn.disabled = !ok; xrBtn.textContent = ok ? '進入 VR' : '此瀏覽器不支援 VR（可用電腦操作）';
  });
} else xrBtn.textContent = '此瀏覽器不支援 VR（可用電腦操作）';
xrBtn.onclick = async () => {
  if (renderer.xr.isPresenting) { renderer.xr.getSession().end(); return; }
  const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
  await renderer.xr.setSession(s); xrBtn.textContent = '離開 VR';
  follow.force = follow.snap = true; if (ctlTab === 'help') drawCtl();      // 進 VR 時面板重新排到你面前；「離開 VR」按鈕出現
  s.addEventListener('end', () => { xrBtn.textContent = '進入 VR'; if (ctlTab === 'help') drawCtl(); });
};

// ═════════════ 啟動 ═════════════
setLayer(stationUI, UI);
// 面板永遠畫在標籤和虛線上面（不被擋住）
for (const m of [fb.mesh, ctl.mesh, rec.mesh, dia.mesh, fbWin.bar.mesh, ctlWin.bar.mesh, recWin.bar.mesh, bub.mesh, telPanel, homeBtn.mesh]) {
  m.renderOrder = m === homeBtn.mesh ? 60 : 50; m.material.transparent = true; m.material.depthTest = false;
  m.children.forEach((c, i) => { c.renderOrder = 51 + i; if (c.material) c.material.depthTest = false; });
}
setLayer(instUI, UI); barsReady = true;
startMode('menu');
window.dbg = { S, D: () => D, G, vals: () => vals, solve, fillStep, skipStep, prevStep, scoreAll, toCalc, commitCell, setCell: k => { cell = k; }, inp: v => { inp = v; }, trueRead, press, placeStation, look, camera, telCam, renderer, rt, startMode, rig, returnHome, teleportTo, keys, labels, homeBtn, wins, ctlTab: () => ctlTab, steps: () => steps, gi: () => gi, goStep, submitPractice, st: () => ({ aimPt, blurBias, MODE }) };
const clock = new THREE.Clock();
renderer.setAnimationLoop(dbg.tick = (fixed) => {
  const dt = typeof fixed === 'number' && fixed < 1 ? fixed : Math.min(clock.getDelta(), 0.05);
  deskInput(dt); xrInput(dt); holdTick(dt);
  updateInstrument(); guideTick(dt); updateLabels(); homeTick(dt); followTick(dt); instTick(dt); dragTick();
  if (MODE === 'exam' && !levelDone) { levelT = G.length() <= LEVEL_OK ? levelT + dt : 0; if (levelT > 1.5) { levelDone = true; if (ctlTab === 'screw') setCtlTab('main'); } }
  if (MODE === 'practice' && (gRedraw -= dt) < 0) { gRedraw = 0.25; const k = steps[gi] && steps[gi].kind; if (k === 'level' || k === 'aim' || k === 'focus') drawFB(); }
  if (MODE !== 'menu' && ctlTab === 'main' && ctlWin.g.visible && !ctlWin.collapsed && (ctlRedraw -= dt) < 0) { ctlRedraw = 0.2; drawCtl(); }
  if (MODE === 'exam' && view === 'book' && (examRedraw -= dt) < 0) { examRedraw = 1; drawFB(); }
  if (endConfirm > 0 && (endConfirm -= dt) <= 0) { endConfirm = 0; drawFB(); }
  drawBubble(); renderTelescope(); ctrlPointTick();
  // three.js r160 的 VR 相機只看得到圖層 0~2；儀器、面板、手把都在圖層 5（UI），要手動打開，不然 VR 裡全部看不見
  if (renderer.xr.isPresenting) { const xc = renderer.xr.getCamera(); xc.layers.enable(UI); for (const c of xc.cameras) c.layers.enable(UI); }
  renderer.render(scene, camera);
});
