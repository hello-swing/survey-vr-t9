<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>水準測量 VR 練習</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#bcd4e6;font-family:system-ui,"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;color:#2b2a27}
  #hud{position:fixed;left:12px;top:12px;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 90px);overflow:auto;box-sizing:border-box;background:#fffffff0;border-radius:10px;padding:12px 14px;font-size:14px;line-height:1.7;box-shadow:0 1px 4px #0003}
  #hud h1{font-size:16px;margin:0 0 4px}
  #hud p{margin:6px 0}
  #hud kbd{display:inline-block;min-width:1.4em;padding:0 4px;border:1px solid #bbb;border-bottom-width:2px;border-radius:4px;background:#f6f6f6;font-family:inherit;font-size:12px;text-align:center}
  #hud .muted{color:#6b6860}
  #hud button{font:inherit;padding:6px 10px;margin:2px 4px 2px 0;border-radius:8px;border:1px solid #9a968c;background:#fff;cursor:pointer}
  #hud button.pri{background:#1f5fa8;color:#fff;border-color:#1f5fa8}
  #hudToggle{position:fixed;left:12px;top:12px;display:none;font:inherit;padding:6px 10px}
  #xr{position:fixed;right:12px;bottom:12px;padding:12px 18px;font-size:16px;border:0;border-radius:10px;background:#1f5fa8;color:#fff;cursor:pointer}
  #xr:disabled{background:#8a8f96;cursor:default}
</style>
</head>
<body>
<div id="hud">
  <h1>水準測量 VR 練習（試題九）</h1>
  <p>先選模式。第一次用請選「練習模式」，系統會一步一步帶你做，左邊的面板會告訴你下一步要做什麼。</p>
  <p><button class="pri" id="mPractice">練習模式</button><button id="mExam">實戰模式</button></p>
  <p><b>電腦操作</b>（Quest 上用手把，見右側面板說明）<br>
  拖曳滑鼠：看四周　滾輪：放大縮小<br>
  點面板上的按鈕：<b>點一下 = 轉一小格，按住 = 連續轉</b><br>
  <kbd>A</kbd><kbd>D</kbd> 鏡頭左右微調（加 <kbd>Shift</kbd> 大轉）<br>
  <kbd>W</kbd><kbd>S</kbd> 對焦遠／近　數字鍵：輸入讀數</p>
  <p><button id="hideHud">收起說明</button></p>
</div>
<button id="hudToggle">說明</button>
<button id="xr" disabled>檢查 VR 支援中…</button>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ═════════════ 基本場景 ═════════════
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
renderer.xr.setReferenceSpaceType('local-floor');
document.body.appendChild(renderer.domElement);
const MAXANI = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbcd4e6);
scene.fog = new THREE.Fog(0xbcd4e6, 150, 450);
scene.add(new THREE.HemisphereLight(0xffffff, 0x6b7a50, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(40, 80, 30); scene.add(sun);

const UI = 5;                 // 只給玩家眼睛看的圖層（望遠鏡看不到）
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.02, 800);
camera.layers.enable(UI);
camera.rotation.order = 'YXZ';
const rig = new THREE.Group(); scene.add(rig); rig.add(camera); camera.position.set(0, 1.6, 0);

const V3 = THREE.Vector3, UP = new V3(0, 1, 0);
const rnd = (a, b) => a + Math.random() * (b - a);
const r3 = v => Math.round(v * 1000) / 1000;
const FONT = '"Microsoft JhengHei","PingFang TC","Noto Sans TC","Noto Sans CJK TC",sans-serif';
const DEG = Math.PI / 180, MIN = DEG / 60;
function setLayer(o, l) { o.traverse(c => c.layers.set(l)); }
function at(o, x, y, z) { o.position.set(x, y, z); return o; }

let MODE = 'menu';            // 'menu' | 'practice' | 'exam'
const practiceOnly = [];      // 練習模式才顯示的 3D 物件

// ═════════════ 題目資料（隨機） ═════════════
const NAMES = 'ABCDEFG';
const SX = [0, 20, 40, 60, 80, 100, 120];
let D;
function interp(g, x) {
  if (x <= SX[0]) return g[0];
  if (x >= SX[6]) return g[6];
  const i = Math.min(5, Math.floor(x / 20)), t = (x - SX[i]) / 20;
  return g[i] + (g[i + 1] - g[i]) * t;
}
function genData() {
  for (;;) {
    const g = [0];
    for (let i = 1; i < 7; i++) g.push(g[i - 1] + rnd(-0.45, 0.45));
    const tops = g.map(v => v + 0.02);
    const st = [{ name: 'P', x: 30, z: 1.5, pts: [0, 1, 2, 3] }, { name: 'Q', x: 90, z: 1.5, pts: [3, 4, 5, 6] }];
    let ok = true;
    for (const s of st) {
      s.gy = interp(g, s.x); s.ih = rnd(1.38, 1.50);
      for (const i of s.pts) { const r = s.gy + s.ih - tops[i]; if (r < 0.35 || r > 2.6) ok = false; }
    }
    if (!ok) continue;
    const HA = r3(rnd(30, 150));
    const H = tops.map(t => HA + t - tops[0]);
    return { g, tops, st, HA, HG: r3(H[6]), H };
  }
}
D = genData();
const groundAt = x => interp(D.g, x);
function trueRead(si, pi) {
  const s = D.st[si];
  const dist = Math.hypot(SX[pi] - s.x, 0 - s.z);
  const mid = s.gy + s.ih - D.tops[pi];
  return { mid, up: mid + dist / 200, low: mid - dist / 200, dist };
}

// ═════════════ 地面、道路、樹 ═════════════
const world = new THREE.Group(); scene.add(world);
let groundMesh, pathMesh;
function buildGround() {
  if (groundMesh) { world.remove(groundMesh, pathMesh); groundMesh.geometry.dispose(); pathMesh.geometry.dispose(); }
  const geo = new THREE.PlaneGeometry(700, 500, 350, 10); geo.rotateX(-Math.PI / 2); geo.translate(60, 0, 0);
  const p = geo.attributes.position, col = [];
  for (let i = 0; i < p.count; i++) {
    p.setY(i, groundAt(p.getX(i)) - 0.002);
    const k = 0.82 + Math.random() * 0.18; col.push(0.40 * k, 0.58 * k, 0.27 * k);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3)); geo.computeVertexNormals();
  groundMesh = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({ vertexColors: true }));
  const pg = new THREE.PlaneGeometry(140, 1.2, 70, 1); pg.rotateX(-Math.PI / 2); pg.translate(60, 0, 0);
  const pp = pg.attributes.position; for (let i = 0; i < pp.count; i++) pp.setY(i, groundAt(pp.getX(i)) + 0.004);
  pg.computeVertexNormals();
  pathMesh = new THREE.Mesh(pg, new THREE.MeshLambertMaterial({ color: 0xb9a57a }));
  world.add(groundMesh, pathMesh);
}
buildGround();
{
  const trunkM = new THREE.MeshLambertMaterial({ color: 0x6b4a2b }), leafM = new THREE.MeshLambertMaterial({ color: 0x3d6b2f });
  for (let i = 0; i < 40; i++) {
    const x = rnd(-80, 200), z = (Math.random() < 0.5 ? -1 : 1) * rnd(12, 90), h = rnd(4, 9);
    world.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.22, h * 0.4, 6), trunkM), x, h * 0.2, z));
    world.add(at(new THREE.Mesh(new THREE.ConeGeometry(h * 0.28, h * 0.7, 8), leafM), x, h * 0.62, z));
  }
  const bM = new THREE.MeshLambertMaterial({ color: 0xd9d2c3 });
  for (const [x, z, w, h] of [[-40, -70, 18, 8], [150, -80, 24, 11], [60, 110, 30, 7]])
    world.add(at(new THREE.Mesh(new THREE.BoxGeometry(w, h, 10), bM), x, h / 2, z));
}

// ═════════════ 文字標籤（3D 浮動） ═════════════
function labelTex(text, color = '#1f5fa8', bg = '#ffffff') {
  const c = document.createElement('canvas'), x = c.getContext('2d'), fs = 52;
  x.font = `500 ${fs}px ${FONT}`;
  c.width = Math.ceil(x.measureText(text).width) + 44; c.height = fs + 30;
  x.font = `500 ${fs}px ${FONT}`;
  x.fillStyle = bg; x.strokeStyle = color; x.lineWidth = 5;
  x.beginPath(); x.roundRect(3, 3, c.width - 6, c.height - 6, 16); x.fill(); x.stroke();
  x.fillStyle = color; x.textBaseline = 'middle'; x.fillText(text, 22, c.height / 2 + 2);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  return { t, aspect: c.width / c.height };
}
function makeSprite(text, h, color, bg) {
  const { t, aspect } = labelTex(text, color, bg);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, depthTest: false, transparent: true }));
  s.scale.set(h * aspect, h, 1); s.renderOrder = 20; s.userData.aspect = aspect;
  return s;
}
function addLabel(parent, text, anchor, pos, color = '#1f5fa8') {
  const g = new THREE.Group();
  const s = makeSprite(text, 0.03, color); s.position.copy(pos);
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([anchor, pos]), new THREE.LineBasicMaterial({ color, depthTest: false }));
  ln.renderOrder = 19;
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.004, 8, 6), new THREE.MeshBasicMaterial({ color, depthTest: false }));
  dot.position.copy(anchor); dot.renderOrder = 19;
  g.add(ln, s, dot); parent.add(g); setLayer(g, UI); practiceOnly.push(g);
  return g;
}

// ═════════════ 水準尺（5 mm 式，自繪） ═════════════
function staffCanvas(m) {
  const W = 256, Hh = 2048, s = Hh / 1000, c = document.createElement('canvas'); c.width = W; c.height = Hh;
  const x = c.getContext('2d'), Y = mm => Hh - mm * s;
  x.fillStyle = '#fbf3cf'; x.fillRect(0, 0, W, Hh);
  x.fillStyle = '#151515';
  for (let k = 0; k < 200; k += 2) x.fillRect(14, Y(k * 5 + 5), 96, 5 * s);
  for (let q = 0; q < 20; q += 2) x.fillRect(96, Y(q * 50 + 50), 22, 50 * s);
  for (let d = 0; d < 10; d++) {
    const mm = d * 100, cm = m * 100 + d * 10;
    x.fillStyle = '#151515'; x.fillRect(122, Y(mm) - 2, W - 122, 4);
    if (m === 0 && d === 0) continue;
    x.font = 'bold 64px Arial,sans-serif'; x.textBaseline = 'bottom'; x.textAlign = 'left';
    x.fillText(String(cm).padStart(3, '0'), 126, Y(mm) - 8);
    x.fillStyle = '#d0201c';
    for (let i = 0; i < m; i++) { x.beginPath(); x.arc(146 + i * 30, Y(mm) - 96, 10, 0, 7); x.fill(); }
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAXANI;
  return t;
}
const staffTex = [0, 1, 2].map(staffCanvas);
const staffBodyM = new THREE.MeshLambertMaterial({ color: 0xe8d9a0 });
const staffFaceM = staffTex.map(t => new THREE.MeshBasicMaterial({ map: t }));
const staffs = [], roleLabels = [];
const ROLE = ['A 起點（高度已知）', 'B 中間點', 'C 中間點', 'D 接力點', 'E 中間點', 'F 中間點', 'G 終點（高度已知）'];
const stakeM = new THREE.MeshLambertMaterial({ color: 0x9a7448 }), nailM = new THREE.MeshLambertMaterial({ color: 0x777777 });
function signTex(txt) {
  const c = document.createElement('canvas'); c.width = 128; c.height = 128; const x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, 128, 128); x.strokeStyle = '#1f5fa8'; x.lineWidth = 8; x.strokeRect(4, 4, 120, 120);
  x.fillStyle = '#1f5fa8'; x.font = 'bold 90px Arial'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(txt, 64, 70);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const stakeGroup = new THREE.Group(); world.add(stakeGroup);
function buildStakes() {
  stakeGroup.clear(); staffs.length = 0; roleLabels.length = 0;
  for (let i = 0; i < 7; i++) {
    const top = D.tops[i], x0 = SX[i];
    stakeGroup.add(at(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.3, 0.03), stakeM), x0, top - 0.15, 0));
    stakeGroup.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.01, 8), nailM), x0, top + 0.004, 0));
    stakeGroup.add(at(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.7, 0.03), stakeM), x0 + 0.5, groundAt(x0) + 0.35, -0.6));
    const sign = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.3), new THREE.MeshBasicMaterial({ map: signTex(NAMES[i]), side: THREE.DoubleSide }));
    stakeGroup.add(at(sign, x0 + 0.5, groundAt(x0) + 0.75, -0.6));
    const st = new THREE.Group(); st.position.set(x0, top, 0); st.userData.pt = i;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.06, 3, 0.025), staffBodyM); body.position.y = 1.5; st.add(body);
    for (let m = 0; m < 3; m++) st.add(at(new THREE.Mesh(new THREE.PlaneGeometry(0.05, 1), staffFaceM[m]), 0, m + 0.5, 0.0131));
    stakeGroup.add(st); staffs.push(st);
    const rl = makeSprite(ROLE[i], 1, i === 0 || i === 6 ? '#a83a1f' : '#1f5fa8');
    rl.position.set(x0, top + 3.4, 0); rl.layers.set(UI); rl.userData.base = top;
    stakeGroup.add(rl); roleLabels.push(rl);
  }
}
buildStakes();

// ═════════════ 水準儀＋腳架 ═════════════
const inst = new THREE.Group(); scene.add(inst);
const tilted = new THREE.Group(); inst.add(tilted);
const upper = new THREE.Group(); tilted.add(upper);
const legs = new THREE.Group(); inst.add(legs);
const darkM = new THREE.MeshLambertMaterial({ color: 0x2c2f33 }), bodyM = new THREE.MeshLambertMaterial({ color: 0xe9ebe6 });
const legM = new THREE.MeshLambertMaterial({ color: 0xc9a46a });
function rod(a, b, r, m) {
  const d = new V3().subVectors(b, a), o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 8), m);
  o.position.copy(a).addScaledVector(d, 0.5); o.quaternion.setFromUnitVectors(UP, d.normalize()); return o;
}
const SCREW_R = 0.055, SCREW_A = [90, 210, 330].map(a => a * DEG);
const SCREW_COL = [0xd23b3b, 0x2f9e44, 0x1f5fa8], SCREW_CSS = ['#d23b3b', '#2f9e44', '#1f5fa8'], SCREW_NAME = ['紅', '綠', '藍'];
const screwMeshes = [];
let sightLine;
{
  tilted.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.068, 0.068, 0.012, 24), darkM), 0, 0.006, 0));
  tilted.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.012, 24), darkM), 0, 0.045, 0));
  SCREW_A.forEach((a, k) => {
    const s = new THREE.Mesh(new THREE.CylinderGeometry(0.016, 0.016, 0.026, 16), new THREE.MeshLambertMaterial({ color: SCREW_COL[k] }));
    s.position.set(SCREW_R * Math.cos(a), 0.026, SCREW_R * Math.sin(a)); s.userData.screw = k; tilted.add(s); screwMeshes.push(s);
  });
  const vial = new THREE.Mesh(new THREE.CylinderGeometry(0.022, 0.022, 0.012, 24), new THREE.MeshLambertMaterial({ color: 0xcfe9f2 }));
  vial.position.set(0, 0.057, 0.035); tilted.add(vial);
  const ring = new THREE.Mesh(new THREE.TorusGeometry(0.008, 0.0008, 6, 24), darkM); ring.rotation.x = Math.PI / 2; ring.position.set(0, 0.0635, 0.035); tilted.add(ring);
  const bubble = new THREE.Mesh(new THREE.SphereGeometry(0.0055, 12, 8), new THREE.MeshBasicMaterial({ color: 0xffffff }));
  bubble.scale.y = 0.4; bubble.position.set(0, 0.063, 0.035); tilted.add(bubble); tilted.userData.bubble = bubble;
  upper.position.y = 0.17;
  upper.add(new THREE.Mesh(new THREE.BoxGeometry(0.075, 0.09, 0.2), bodyM));
  const obj = new THREE.Mesh(new THREE.CylinderGeometry(0.032, 0.032, 0.05, 20), darkM); obj.rotation.x = Math.PI / 2; obj.position.z = -0.12; upper.add(obj);
  const lens = new THREE.Mesh(new THREE.CircleGeometry(0.026, 20), new THREE.MeshBasicMaterial({ color: 0x5fa8d8 })); lens.position.z = -0.1451; lens.rotation.y = Math.PI; upper.add(lens);
  const eye = new THREE.Mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.04, 16), darkM); eye.rotation.x = Math.PI / 2; eye.position.z = 0.12; upper.add(eye);
  const knob = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 0.02, 16), darkM); knob.rotation.z = Math.PI / 2; knob.position.set(0.048, 0.01, -0.02); upper.add(knob);
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.04, 0.12, 16), bodyM); neck.position.y = -0.105; upper.add(neck);
  upper.add(at(new THREE.Mesh(new THREE.BoxGeometry(0.008, 0.012, 0.12), darkM), 0, 0.052, 0));
  // 視線（練習模式）：從鏡頭往前射出的紅色虛線
  const sg = new THREE.BufferGeometry().setFromPoints([new V3(0, 0, -0.15), new V3(0, 0, -70)]);
  sightLine = new THREE.Line(sg, new THREE.LineDashedMaterial({ color: 0xe03131, dashSize: 0.25, gapSize: 0.15 }));
  sightLine.computeLineDistances(); upper.add(sightLine); practiceOnly.push(sightLine);
}
setLayer(inst, UI);
// 儀器標籤（練習模式）
addLabel(upper, '鏡頭（前面，從這裡看出去）', new V3(0, 0, -0.15), new V3(0, 0.13, -0.24), '#c0281e');
addLabel(upper, '目鏡（後面，眼睛靠這裡）', new V3(0, 0, 0.14), new V3(-0.05, 0.12, 0.2));
addLabel(upper, '對焦旋鈕', new V3(0.058, 0.01, -0.02), new V3(0.2, 0.07, -0.05));
addLabel(tilted, '氣泡：要在小圈圈中間', new V3(0, 0.064, 0.035), new V3(-0.2, 0.11, 0.12));
addLabel(tilted, '腳螺旋（紅綠藍三顆，用來調水平）', new V3(SCREW_R * Math.cos(SCREW_A[2]), 0.03, SCREW_R * Math.sin(SCREW_A[2])), new V3(0.22, -0.03, 0.12));
const legLabel = addLabel(inst, '腳架', new V3(0.25, 0.7, 0.15), new V3(0.4, 0.8, 0.25), '#6b4a2b');

// ═════════════ 儀器狀態 ═════════════
const COMP_RANGE = 15 * MIN, LEVEL_OK = 10 * MIN;
const STEP = { yawFine: 0.02 * DEG, yawBig: 1.5 * DEG, focus: 0.035, screw: 0.00006 };
const S = { si: 0, yaw: 0, lf: Math.log(3), screw: [0, 0, 0], tripod: new THREE.Vector2(), sel: 0 };
const G = new THREE.Vector2();
function computeG(screws, out) {
  out.copy(S.tripod);
  screws.forEach((h, k) => { out.x += 2 / (3 * SCREW_R) * h * Math.cos(SCREW_A[k]); out.y += 2 / (3 * SCREW_R) * h * Math.sin(SCREW_A[k]); });
  return out;
}
function updateTilt() {
  computeG(S.screw, G);
  tilted.quaternion.setFromUnitVectors(UP, new V3(-G.x, 1, -G.y).normalize());
  const b = tilted.userData.bubble, k = 2.6, max = 0.016;
  b.position.x = THREE.MathUtils.clamp(G.x * k, -max, max); b.position.z = 0.035 + THREE.MathUtils.clamp(G.y * k, -max, max);
}
function turnScrew(k, dir, mult = 1) { S.sel = k; S.screw[k] = THREE.MathUtils.clamp(S.screw[k] + dir * STEP.screw * mult, -0.01, 0.01); updateTilt(); }
function turnYaw(d) { S.yaw += d; }
function focusStep(dir) { S.lf = THREE.MathUtils.clamp(S.lf + dir * STEP.focus, Math.log(1.5), Math.log(150)); }

const telCam = new THREE.PerspectiveCamera(1.6, 1, 0.3, 800);
const TEL_HALF = Math.tan(1.6 / 2 * DEG);
scene.add(telCam);
function placeStation(si, fresh = true) {
  S.si = si; const s = D.st[si];
  inst.position.set(s.x, s.gy, s.z);
  legs.clear();
  const hh = s.ih - 0.17;
  for (let k = 0; k < 3; k++) {
    const a = SCREW_A[k] + Math.PI / 3 + rnd(-0.15, 0.15), r = rnd(0.42, 0.55);
    legs.add(rod(new V3(0.07 * Math.cos(a), hh - 0.02, 0.07 * Math.sin(a)), new V3(r * Math.cos(a), groundAt(s.x + r * Math.cos(a)) - s.gy, r * Math.sin(a)), 0.016, legM));
  }
  legs.add(at(new THREE.Mesh(new THREE.CylinderGeometry(0.085, 0.085, 0.03, 24), legM), 0, hh - 0.015, 0));
  setLayer(legs, UI);
  tilted.position.y = hh;
  legLabel.position.y = hh - 1.2;
  if (fresh) {
    const mag = rnd(0.4, 1.0) * DEG, dir = rnd(0, Math.PI * 2);
    S.tripod.set(Math.cos(dir) * mag, Math.sin(dir) * mag);
    S.screw = [0, 0, 0];
    S.yaw = rnd(-0.5, 0.5); S.lf = Math.log(rnd(2, 4)); S.sel = 0;
  }
  for (const st of staffs) st.lookAt(s.x, st.position.y, s.z);

// ═════════════ 2D 面板工具 ═════════════
class Panel {
  constructor(w, h, pw, ph) {
    this.c = document.createElement('canvas'); this.c.width = pw; this.c.height = ph; this.x = this.c.getContext('2d');
    this.tex = new THREE.CanvasTexture(this.c); this.tex.colorSpace = THREE.SRGBColorSpace; this.tex.anisotropy = MAXANI;
    this.mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: this.tex }));
    this.mesh.userData.panel = this; this.regions = [];
  }
  find(uv) {
    const px = uv.x * this.c.width, py = (1 - uv.y) * this.c.height;
    for (const r of this.regions) if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return r;
    return null;
  }
  bg(col = '#fbfaf6') { this.regions = []; this.x.fillStyle = col; this.x.fillRect(0, 0, this.c.width, this.c.height); }
  rect(x0, y0, w, h, fill, stroke, lw = 2) { const x = this.x; x.beginPath(); x.roundRect(x0, y0, w, h, 12); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.strokeStyle = stroke; x.lineWidth = lw; x.stroke(); } }
  text(t, x0, y0, size = 26, color = '#2b2a27', align = 'left', weight = '') {
    const x = this.x; x.font = `${weight} ${size}px ${FONT}`; x.fillStyle = color; x.textAlign = align; x.textBaseline = 'middle'; x.fillText(t, x0, y0);
  }
  wrap(t, x0, y0, maxW, size = 28, color = '#2b2a27', lh = 1.5, weight = '') {      // 中文逐字換行，回傳下一行 y
    const x = this.x; x.font = `${weight} ${size}px ${FONT}`; x.fillStyle = color; x.textAlign = 'left'; x.textBaseline = 'middle';
    let line = '';
    for (const ch of t) {
      if (x.measureText(line + ch).width > maxW && line) { x.fillText(line, x0, y0); y0 += size * lh; line = ch; }
      else line += ch;
    }
    if (line) { x.fillText(line, x0, y0); y0 += size * lh; }
    return y0;
  }
  btn(x0, y0, w, h, label, fn, { fill = '#ffffff', color = '#2b2a27', size = 30, stroke = '#9a968c', rep = false, lw = 2 } = {}) {
    this.rect(x0, y0, w, h, fill, stroke, lw); this.text(label, x0 + w / 2, y0 + h / 2 + 1, size, color, 'center', '500');
    this.regions.push({ x: x0, y: y0, w, h, fn, rep });
  }
  update() { this.tex.needsUpdate = true; }
}

function ctrlRay(c) { tmpM.identity().extractRotation(c.matrixWorld); ray.ray.origin.setFromMatrixPosition(c.matrixWorld); ray.ray.direction.set(0, 0, -1).applyMatrix4(tmpM); }
function heading(c) { tmpM.identity().extractRotation(c.matrixWorld); const f = new V3(0, 0, -1).applyMatrix4(tmpM); return Math.atan2(-f.x, -f.z); }
const ctrls = [0, 1].map(i => {
  const c = renderer.xr.getController(i); rig.add(c);
  const line = new THREE.Line(rayGeo, new THREE.LineBasicMaterial({ color: 0xd9480f })); line.scale.z = 3; c.add(line);
  c.add(at(new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.03, 0.09), new THREE.MeshLambertMaterial({ color: 0x333333 })), 0, 0, 0.03));
  setLayer(c, UI); c.visible = false;
  c.addEventListener('connected', e => { c.userData.src = e.data; c.visible = true; });
  c.addEventListener('disconnected', () => { c.userData.src = null; c.visible = false; });
  c.addEventListener('selectstart', () => { ctrlRay(c); pressHit(ray.intersectObjects(clickables(), false)[0]); });
  c.addEventListener('selectend', endPress);
  c.addEventListener('squeezestart', () => { c.userData.grab = heading(c); });
  c.addEventListener('squeezeend', () => { c.userData.grab = null; });
  return c;
});
const sticks = {};
function stickStep(key, v, pos, neg, dt) {
  const s = sticks[key] || (sticks[key] = { on: 0, t: 0, acc: 0 });
  const dir = v > 0.55 ? 1 : v < -0.55 ? -1 : 0;
  if (Math.abs(v) < 0.3) s.on = 0;
  if (!dir) return;
  if (s.on !== dir) { s.on = dir; s.t = 0; s.acc = 0; (dir > 0 ? pos : neg)(); return; }
  s.t += dt;
  if (s.t > 0.4) { s.acc += dt; while (s.acc > 0.05) { s.acc -= 0.05; (dir > 0 ? pos : neg)(); } }
}
function xrInput(dt) {
  const s = renderer.xr.getSession(); if (!s) return;
  for (const src of s.inputSources) {
    const gp = src.gamepad; if (!gp || gp.axes.length < 4) continue;
    const ax = gp.axes[2], ay = gp.axes[3];
    if (src.handedness === 'left') {
      stickStep('lx', ax, () => turnYaw(-STEP.yawFine), () => turnYaw(STEP.yawFine), dt);
      stickStep('ly', ay, () => focusStep(-1), () => focusStep(1), dt);
    } else if (src.handedness === 'right') {
      stickStep('rx', ax, () => turnScrew(S.sel, 1), () => turnScrew(S.sel, -1), dt);
    }
  }
  for (const c of ctrls) {
    if (c.userData.grab != null) {            // 握把：手轉多少，鏡頭就轉多少
      const h = heading(c); let d = h - c.userData.grab;
      if (d > Math.PI) d -= 2 * Math.PI; if (d < -Math.PI) d += 2 * Math.PI;
      S.yaw += d; c.userData.grab = h;
    }
    ctrlRay(c);
    const hit = ray.intersectObjects(clickables(), false)[0];
    c.children[0].scale.z = hit ? hit.distance : 3;
  }
}
function deskInput() { if (!renderer.xr.isPresenting) { camera.rotation.y = look.yaw; camera.rotation.x = look.pitch; } }

// ═════════════ 進入 VR ═════════════
const xrBtn = document.getElementById('xr');
if (navigator.xr) {
  navigator.xr.isSessionSupported('immersive-vr').then(ok => {
    xrBtn.disabled = !ok; xrBtn.textContent = ok ? '進入 VR' : '此瀏覽器不支援 VR（可用電腦操作）';
  });
} else xrBtn.textContent = '此瀏覽器不支援 VR（可用電腦操作）';
xrBtn.onclick = async () => {
  if (renderer.xr.isPresenting) { renderer.xr.getSession().end(); return; }
  const s = await navigator.xr.requestSession('immersive-vr', { optionalFeatures: ['local-floor'] });
  await renderer.xr.setSession(s); xrBtn.textContent = '離開 VR';
  s.addEventListener('end', () => { xrBtn.textContent = '進入 VR'; });
};

// ═════════════ 啟動 ═════════════
setLayer(stationUI, UI);
// 面板永遠畫在標籤和虛線上面（不被擋住）
for (const m of [fb.mesh, ctl.mesh, bub.mesh, telPanel]) {
  m.renderOrder = 50; m.material.transparent = true; m.material.depthTest = false;
  m.children.forEach((c, i) => { c.renderOrder = 51 + i; if (c.material) c.material.depthTest = false; });
}
startMode('menu');
window.dbg = { S, D: () => D, G, entries: () => entries, trueRead, press, placeStation, look, camera, telCam, renderer, rt, startMode, steps: () => steps, gi: () => gi, goStep, submitRead, st: () => ({ aimPt, blurBias, MODE }) };
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  deskInput(); xrInput(dt); holdTick(dt);
  updateInstrument(); guideTick(dt);
  if (MODE === 'practice' && (gRedraw -= dt) < 0) { gRedraw = 0.25; const k = steps[gi] && steps[gi].kind; if (k === 'level' || k === 'aim' || k === 'focus') drawFB(); }
  drawBubble(); renderTelescope();
  renderer.render(scene, camera);
});
</script>
